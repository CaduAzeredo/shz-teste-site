# RASCUNHO — a cadeia release → site (Bloco B, 15/10). NÃO está ligado em
# repositório nenhum. Para usar: copiar para `.github/workflows/` do site (o
# primeiro é o shz-teste-site), pôr o arquivo de assinantes (ver o LEIA-ME desta
# pasta) e rodar os oito testes negativos de `testes-negativos.md` antes de
# afirmar a cadeia em qualquer página.
#
# O que ele faz, nesta ordem, e para no primeiro passo que falhar:
#   1. confere que o runner tem ssh-keygen (sem ele, a assinatura não se confere);
#   2. lê a release Latest pública do pacote e baixa a ficha anexada;
#   3. clona o pacote e confere a ficha com `ficha-release --check`, usando o
#      script de um commit FIXADO do pacote (não o da release em teste) e a lista
#      de assinantes do Cadu, que o pacote não traz;
#   4. copia a ficha para o site com `scripts/ficha.mjs` e confere que só os dois
#      arquivos da ficha mudaram;
#   5. abre um PR num ramo `preview/ficha-<tag>`. O merge continua com o dono.
#
# Credencial: só o GITHUB_TOKEN do próprio site, com escrita no próprio site. O
# pacote é lido como qualquer visitante lê, sem token de outro repositório.

name: cadeia da ficha

on:
  schedule:
    - cron: "17 9 * * *" # uma vez por dia, 06h17 em Brasília
  workflow_dispatch:
    inputs:
      pacote:
        description: "Repositório do pacote (os testes negativos apontam para um pacote de teste)"
        required: false
        default: "CaduAzeredo/shizune"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cadeia-ficha
  cancel-in-progress: false

env:
  PACOTE: ${{ inputs.pacote || 'CaduAzeredo/shizune' }}
  # De onde sai o script que confere: um commit FIXADO do pacote real, mesmo
  # quando os testes apontam `pacote` para um pacote de teste. Quem controla
  # uma release não controla o conferidor. Trocar só por PR assinado, depois de
  # ler o diff do script. b9abf7e = v0.5.0.
  CONFERIDOR_REPO: CaduAzeredo/shizune
  CONFERIDOR_EM: b9abf7e6696d51b73f7faccf199b0e368b4c0f10
  ASSINANTES: .github/assinantes-do-pacote
  FICHA: src/content/ficha-release.json
  ULTIMA: src/content/release-mais-recente.json

jobs:
  ficha:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: o runner tem ssh-keygen
        run: |
          if ! command -v ssh-keygen >/dev/null 2>&1; then
            echo "::error title=ambiente sem ssh-keygen::Este runner não tem ssh-keygen, e sem ele a assinatura SSH do commit da tag não se confere. A cadeia para aqui, sem PR. Use um runner com OpenSSH (o ubuntu-latest tem)."
            exit 1
          fi
          ssh-keygen -? 2>&1 | head -1 || true

      # SHA da tag v4.2.2 do actions/checkout, conferido em 15/10/2026 com
      # `gh api repos/actions/checkout/git/ref/tags/v4.2.2`.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: a lista de assinantes existe
        run: |
          if [ ! -s "$ASSINANTES" ]; then
            echo "::error title=sem assinantes::Falta $ASSINANTES, com a chave humana do Cadu. Sem ela nenhuma ficha passa, e é melhor parar dizendo isso."
            exit 1
          fi

      - name: a release Latest pública e a ficha anexada
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A "Latest" da API nunca é draft nem pre-release (testes 1 e 2). A
          # guarda abaixo repete isso por escrito: se um dia a API mudar, a
          # cadeia para em vez de publicar o que não foi publicado.
          gh api "repos/$PACOTE/releases/latest" --jq '[.tag_name, (.draft|tostring), (.prerelease|tostring)] | join(" ")' > "$RUNNER_TEMP/latest.txt"
          read -r tag draft pre < "$RUNNER_TEMP/latest.txt"
          if [ "$draft" != "false" ] || [ "$pre" != "false" ]; then
            echo "::error title=release não publicada::$tag é draft ($draft) ou pre-release ($pre). A cadeia só lê release publicada. Sem PR."
            exit 1
          fi
          echo "release Latest de $PACOTE: $tag"
          mkdir -p "$RUNNER_TEMP/release"
          if ! gh release download "$tag" --repo "$PACOTE" --pattern shizune-release.json --dir "$RUNNER_TEMP/release"; then
            echo "::error title=sem ficha::A release $tag não tem o asset shizune-release.json. Sem ficha, sem PR."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: conferir a ficha (schema, sha da tag, assinatura G)
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git clone --quiet "https://github.com/$PACOTE.git" "$RUNNER_TEMP/pacote"
          git -C "$RUNNER_TEMP/pacote" fetch --quiet --tags
          git -C "$RUNNER_TEMP/pacote" config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/$ASSINANTES"
          git clone --quiet --filter=blob:none --no-checkout "https://github.com/$CONFERIDOR_REPO.git" "$RUNNER_TEMP/conferidor"
          git -C "$RUNNER_TEMP/conferidor" show "$CONFERIDOR_EM:scripts/ficha-release.mjs" > "$RUNNER_TEMP/conferidor.mjs"
          node "$RUNNER_TEMP/conferidor.mjs" --check "$RUNNER_TEMP/release/shizune-release.json" --tag "$TAG" --arvore="$RUNNER_TEMP/pacote"

      - name: copiar a ficha para o site
        id: copia
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/ficha.mjs "$RUNNER_TEMP/release/shizune-release.json"
          mudou=$(git status --porcelain | sed 's/^...//' | sort | tr '\n' ' ')
          if [ -z "$mudou" ]; then
            echo "a ficha de $TAG já é a do site. Nada a fazer."
            echo "nada=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          esperado=$(printf '%s\n%s\n' "$FICHA" "$ULTIMA" | sort | tr '\n' ' ')
          so_ficha=$(printf '%s\n' "$FICHA" | tr '\n' ' ')
          if [ "$mudou" != "$esperado" ] && [ "$mudou" != "$so_ficha" ]; then
            echo "::error title=mudou além da ficha::A cópia mexeu em: $mudou. Só $FICHA e $ULTIMA podem mudar. Sem PR."
            exit 1
          fi

      # Um PR aberto com o GITHUB_TOKEN NÃO dispara os workflows do próprio
      # repositório (regra do GitHub contra laço de automação): o `portao.yml`
      # do site não rodaria no PR da cadeia. Por isso o portão roda aqui, antes
      # de o PR existir, com a ficha nova. O preview da Vercel sai do push do
      # ramo, como sempre. O comando é o do site; no shizune.dev, o abaixo.
      # SHA da tag v2.2.0 do oven-sh/setup-bun (a mesma da tag móvel v2 em
      # 15/10/2026), lido com `gh api repos/oven-sh/setup-bun/git/ref/tags/v2.2.0`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.copia.outputs.nada != '1'
      - name: o portão do site, com a ficha nova
        if: steps.copia.outputs.nada != '1'
        run: |
          bun install --frozen-lockfile
          bun run portao

      - name: abrir o PR em preview/*
        if: steps.copia.outputs.nada != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          ramo="preview/ficha-$TAG"
          if git ls-remote --exit-code --heads origin "$ramo" >/dev/null 2>&1; then
            echo "o ramo $ramo já existe: o PR desta ficha já foi aberto. Nada a fazer."
            exit 0
          fi
          git config user.name "cadeia-da-ficha"
          git config user.email "cadeia-da-ficha@users.noreply.github.com"
          git switch -c "$ramo"
          git add "$FICHA" "$ULTIMA"
          git commit -m "chore(ficha): ficha da release $TAG, conferida pela cadeia"
          git push origin "$ramo"
          gh pr create --base main --head "$ramo" \
            --title "Ficha da release $TAG" \
            --body "A cadeia leu a release Latest de \`$PACOTE\` ($TAG), conferiu a ficha (schema, sha da tag e assinatura G com a lista de assinantes deste repositório) e copiou o arquivo sem mudança. O diff abaixo é a ficha: cada número que muda nas páginas muda aqui. O portão do site rodou com esta ficha no job que abriu o PR (um PR aberto pelo GITHUB_TOKEN não dispara o portao.yml). O merge é do dono."
