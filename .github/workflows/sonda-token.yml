# RASCUNHO — a sonda dos testes 4 e 5 da cadeia (lista de 14/10). NÃO está
# ligada. Vai para `.github/workflows/` do shz-teste-site só para rodar os
# testes, e sai depois. Ela usa o mesmo GITHUB_TOKEN, com as mesmas permissões,
# que a cadeia usa, e tenta as duas coisas que a cadeia nunca pode fazer:
#
#   teste 4 — fazer merge de um PR no `main`;
#   teste 5 — escrever direto no `main`.
#
# Os dois têm de ser RECUSADOS pela proteção do ramo `main` (ver o LEIA-ME desta
# pasta). A sonda termina verde só se as duas tentativas falharem, e vermelha
# se qualquer uma passar — aí a cadeia não pode ser ligada.

name: sonda do token da cadeia

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Número de um PR aberto pela cadeia (de preview/* para main)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # SHA da tag v4.2.2 do actions/checkout, conferido em 15/10/2026 com
      # `gh api repos/actions/checkout/git/ref/tags/v4.2.2`.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: teste 5 — o token tenta escrever direto no main
        run: |
          git config user.name "sonda-da-cadeia"
          git config user.email "sonda-da-cadeia@users.noreply.github.com"
          git commit --allow-empty -m "sonda: este commit não pode chegar ao main"
          if git push origin HEAD:main; then
            echo "::error title=teste 5 reprovou::o GITHUB_TOKEN escreveu direto no main. Ligue a proteção do ramo antes de ligar a cadeia."
            exit 1
          fi
          echo "teste 5 passou: o push direto no main foi recusado."

      - name: teste 4 — o token tenta fazer merge do PR no main
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          if gh pr merge "$PR" --merge --repo "$GITHUB_REPOSITORY"; then
            echo "::error title=teste 4 reprovou::o GITHUB_TOKEN fez merge do PR $PR no main. Ligue a proteção do ramo antes de ligar a cadeia."
            exit 1
          fi
          echo "teste 4 passou: o merge pelo token foi recusado."
